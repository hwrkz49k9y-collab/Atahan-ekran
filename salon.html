<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Salon Saati</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; color: #f2f2f2; font-family: "Roboto", "Segoe UI", Arial, sans-serif; overflow: hidden; user-select: none; }
  #ekran { height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 4vh 5vw; transition: opacity 2s; }
  .ust, .alt { display: flex; justify-content: space-between; align-items: center; font-size: 4.2vh; color: #a8a8a8; }
  .saat { text-align: center; font-size: 34vh; font-weight: 300; line-height: 1; letter-spacing: 0.5vw; font-variant-numeric: tabular-nums; }
  .saniye { font-size: 9vh; color: #666; margin-left: 1vw; vertical-align: top; }
  .hava { display: flex; align-items: center; gap: 1.5vw; }
  .hava b { color: #f2f2f2; font-weight: 400; }
  .vakit b { color: #7fc8f0; font-weight: 400; }
  .gece { opacity: 0.35; }
  #ipucu { position: fixed; bottom: 1vh; left: 0; right: 0; text-align: center; font-size: 2.6vh; color: #555; }
</style>
</head>
<body>
<div id="ekran">
  <div class="ust">
    <span id="tarih">—</span>
    <span class="hava"><span id="ikon"></span><b id="derece">--°</b><span>Kdz. Ereğli</span></span>
  </div>
  <div class="saat"><span id="saat">--:--</span><span class="saniye" id="sn"></span></div>
  <div class="alt">
    <span class="vakit" id="nem">Nem --%</span>
    <span id="yarin"></span>
  </div>
</div>
<div id="ipucu">Tam ekran için dokun</div>

<script>
const ENLEM = 41.28, BOYLAM = 31.42;
const GECE_BAS = 23, GECE_BIT = 7;

const gunler = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const aylar = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const iki = n => String(n).padStart(2, "0");

function saatGuncelle() {
  const d = new Date();
  document.getElementById("saat").textContent = iki(d.getHours()) + ":" + iki(d.getMinutes());
  document.getElementById("sn").textContent = iki(d.getSeconds());
  document.getElementById("tarih").textContent = d.getDate() + " " + aylar[d.getMonth()] + " " + d.getFullYear() + ", " + gunler[d.getDay()];
  const h = d.getHours();
  document.getElementById("ekran").classList.toggle("gece", h >= GECE_BAS || h < GECE_BIT);
}

function havaIkon(kod) {
  if (kod === 0) return "☀️";
  if (kod <= 2) return "🌤️";
  if (kod === 3) return "☁️";
  if (kod <= 48) return "🌫️";
  if (kod <= 67 || (kod >= 80 && kod <= 82)) return "🌧️";
  if (kod <= 77 || kod === 85 || kod === 86) return "❄️";
  return "⛈️";
}

async function havaGetir() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${ENLEM}&longitude=${BOYLAM}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=Europe%2FIstanbul&forecast_days=2`;
    const r = await fetch(url); const j = await r.json();
    document.getElementById("derece").textContent = Math.round(j.current.temperature_2m) + "°C";
    document.getElementById("ikon").textContent = havaIkon(j.current.weather_code);
    document.getElementById("nem").innerHTML = "Nem <b>%" + Math.round(j.current.relative_humidity_2m) + "</b> · Hissedilen <b>" + Math.round(j.current.apparent_temperature) + "°</b>";
    document.getElementById("yarin").textContent = "Yarın " + havaIkon(j.daily.weather_code[1]) + " " + Math.round(j.daily.temperature_2m_min[1]) + "° / " + Math.round(j.daily.temperature_2m_max[1]) + "°";
  } catch (e) {}
}

let kilit = null;
async function uyanikTut() {
  try { if ("wakeLock" in navigator) kilit = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") uyanikTut(); });

document.body.addEventListener("click", () => {
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {});
  document.getElementById("ipucu").style.display = "none";
  uyanikTut();
});

saatGuncelle(); havaGetir(); uyanikTut();
setInterval(saatGuncelle, 1000);
setInterval(havaGetir, 15 * 60 * 1000);
setTimeout(() => location.reload(), 6 * 60 * 60 * 1000);
</script>
</body>
</html>
