<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Salon Saati</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; color: #f2f2f2; font-family: "Roboto", "Segoe UI", Arial, sans-serif; overflow: hidden; user-select: none; }
  #ekran { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; transition: opacity 2s; }
  .satir { position: absolute; left: 4vw; right: 4vw; transition: opacity 1.5s; }
  .satir.ust { top: 3vh; }
  .satir.alt { bottom: 3vh; }
  .sade .satir { opacity: 0; }
  .satir { display: flex; justify-content: space-between; align-items: flex-start; }
  .kose { line-height: 1.1; }
  .kose.sag { text-align: right; }
  .buyuk { font-size: 10vh; color: #ffffff; white-space: nowrap; }
  .kucuk { font-size: 5.5vh; color: #b8b8b8; white-space: nowrap; margin-top: 0.5vh; }
  .alt .kucuk { margin-top: 0; margin-bottom: 0.5vh; }
  .mavi { color: #7fc8f0; }
  .saat { text-align: center; font-family: "Bebas Neue", "Roboto", Arial, sans-serif; font-size: 40vh; font-weight: 400; line-height: 0.9; letter-spacing: 1vw; transition: font-size 1.5s ease; }
  .sade .saat { font-size: min(62vh, 40vw); }
  .saniye { transition: font-size 1.5s ease; font-size: 11vh; color: #666; margin-left: 1.5vw; vertical-align: top; letter-spacing: 0.3vw; }
  .sade .saniye { font-size: 14vh; }
  .gece { opacity: 0.35; }
</style>
</head>
<body>
<div id="ekran" class="sade">
  <div class="satir ust">
    <div class="kose"><div class="buyuk" id="tarih">—</div><div class="kucuk" id="gun"></div></div>
    <div class="kose sag"><div class="buyuk"><span id="ikon"></span> <span id="derece">--°</span></div><div class="kucuk">Kdz. Ereğli</div></div>
  </div>
  <div class="saat"><span id="saat">--:--</span><span class="saniye" id="sn"></span></div>
  <div class="satir alt">
    <div class="kose"><div class="kucuk">Hissedilen <span id="his">--°</span></div><div class="buyuk">Nem <span class="mavi" id="nem">--%</span></div></div>
    <div class="kose sag"><div class="kucuk">Yarın <span id="yikon"></span></div><div class="buyuk" id="yarin">--° / --°</div></div>
  </div>
</div>

<script>
const ENLEM = 41.28, BOYLAM = 31.42;
const GECE_BAS = 23, GECE_BIT = 7;

const gunler = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const aylar = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const iki = n => String(n).padStart(2, "0");

function saatGuncelle() {
  const d = new Date();
  document.getElementById("saat").textContent = iki(d.getHours()) + ":" + iki(d.getMinutes());
  document.getElementById("sn").textContent = iki(d.getSeconds());
  document.getElementById("tarih").textContent = d.getDate() + " " + aylar[d.getMonth()];
  document.getElementById("gun").textContent = gunler[d.getDay()] + ", " + d.getFullYear();
  const h = d.getHours();
  document.getElementById("ekran").classList.toggle("gece", h >= GECE_BAS || h < GECE_BIT);
  saatBasiKontrol(d);
  bilgiKontrol(d);
}

function havaIkon(kod) {
  if (kod === 0) return "☀️";
  if (kod <= 2) return "🌤️";
  if (kod === 3) return "☁️";
  if (kod <= 48) return "🌫️";
  if (kod <= 67 || (kod >= 80 && kod <= 82)) return "🌧️";
  if (kod <= 77 || kod === 85 || kod === 86) return "❄️";
  return "⛈️";
}

async function havaGetir() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${ENLEM}&longitude=${BOYLAM}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=Europe%2FIstanbul&forecast_days=2`;
    const r = await fetch(url); const j = await r.json();
    document.getElementById("derece").textContent = Math.round(j.current.temperature_2m) + "°C";
    document.getElementById("ikon").textContent = havaIkon(j.current.weather_code);
    document.getElementById("nem").textContent = "%" + Math.round(j.current.relative_humidity_2m);
    document.getElementById("his").textContent = Math.round(j.current.apparent_temperature) + "°";
    document.getElementById("yikon").textContent = havaIkon(j.daily.weather_code[1]);
    document.getElementById("yarin").textContent = Math.round(j.daily.temperature_2m_min[1]) + "° / " + Math.round(j.daily.temperature_2m_max[1]) + "°";
  } catch (e) {}
}


const BILGI_ARALIK = 20, BILGI_SURE = 60;
let elleAcikBitis = 0;
function bilgiKontrol(d) {
  const dk = d.getMinutes(), sn = d.getSeconds();
  const zamanli = (dk % BILGI_ARALIK === 0) && (sn < BILGI_SURE);
  const goster = zamanli || Date.now() < elleAcikBitis;
  document.getElementById("ekran").classList.toggle("sade", !goster);
}

const SES_BAS = 8, SES_BIT = 1;
let ses = null, sonCalinan = -1;
function sesHazirla() {
  try { if (!ses) ses = new (window.AudioContext || window.webkitAudioContext)(); if (ses.state === "suspended") ses.resume(); } catch (e) {}
}
function nota(frekans, baslangic, sure) {
  const t = ses.currentTime + baslangic;
  [1, 2.01, 3.02].forEach((kat, i) => {
    const o = ses.createOscillator(), g = ses.createGain();
    o.type = "sine"; o.frequency.value = frekans * kat;
    const v = [0.5, 0.15, 0.06][i];
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + sure);
    o.connect(g).connect(ses.destination);
    o.start(t); o.stop(t + sure);
  });
}
function dingDong() {
  sesHazirla(); if (!ses) return;
  nota(659.25, 0, 2.2);
  nota(523.25, 0.7, 2.8);
}
function saatBasiKontrol(d) {
  const h = d.getHours();
  if (d.getMinutes() === 0 && d.getSeconds() < 5 && sonCalinan !== h && (h >= SES_BAS || h <= SES_BIT)) {
    sonCalinan = h; dingDong();
  }
}

let kilit = null;
async function uyanikTut() {
  try { if ("wakeLock" in navigator) kilit = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") uyanikTut(); });

document.body.addEventListener("click", () => {
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {});
  uyanikTut();
  sesHazirla();
  elleAcikBitis = Date.now() + BILGI_SURE * 1000;
  bilgiKontrol(new Date());
});

saatGuncelle(); havaGetir(); uyanikTut();
setInterval(saatGuncelle, 1000);
setInterval(havaGetir, 15 * 60 * 1000);
setTimeout(() => location.reload(), 6 * 60 * 60 * 1000);
</script>
</body>
</html>
