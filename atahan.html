<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Atahan</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
  html,body{margin:0;height:100%;background:#000;color:#F1EFE8;font-family:system-ui,Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
  .wrap{box-sizing:border-box;height:100vh;padding:4vh 5vw 4vh 7vw;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:min(7vh,3.4vw)}
  .gr{font-weight:500;color:#CECBF6;display:flex;align-items:center;gap:1.2vw;white-space:nowrap}
  .dt{color:#D3D1C7;white-space:nowrap}
  .clk{text-align:center;font-size:min(54vh,27vw);font-weight:500;line-height:.95;color:#FFFFFF;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .sec{font-size:.25em;color:#B4B2A9;letter-spacing:0;margin-left:.15em}
  .wx{display:flex;justify-content:center;align-items:center;gap:2.2vw;white-space:nowrap;font-size:min(6vh,3vw);color:#D3D1C7}
  .wx i{font-size:min(10vh,5vw);line-height:1}
  .tmp{font-size:min(9vh,4.5vw);font-weight:500;color:#F1EFE8}
  .tm{color:#B4B2A9}
  .bot{display:grid;grid-template-columns:1fr 1fr;gap:2.5vw}
  .card{background:#2C2C2A;border-radius:2vh;padding:1.8vh 2.5vw;font-size:min(5.5vh,2.7vw);color:#E6E4DC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card i{margin-right:1vw}
  body.night .gr{color:#7F77DD}
  body.night .clk{color:#B4B2A9}
  body.night .sec,body.night .dt,body.night .wx,body.night .card{opacity:.45}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="gr"><i class="ti ti-rocket" id="gi" style="color:#AFA9EC"></i><span id="gr">Merhaba Atahan</span></div>
    <div class="dt" id="dt"></div>
  </div>
  <div class="clk"><span id="hm">--:--</span><span class="sec" id="ss">:--</span></div>
  <div class="wx">
    <i class="ti ti-cloud" id="wi" style="color:#B4B2A9"></i>
    <span class="tmp" id="wt">--°</span>
    <span id="wd">Hava durumu yükleniyor</span>
    <span class="tm" id="wtm"></span>
  </div>
  <div class="bot">
    <div class="card" id="sc"><i class="ti ti-backpack" style="color:#5DCAA5"></i>Ders programı eklenecek</div>
    <div class="card" id="sl"><i class="ti ti-moon" style="color:#AFA9EC"></i>Uyku saati 22:00</div>
  </div>
</div>
<script>
/* ===== AYARLAR — buradan değiştirilebilir ===== */
const AD = "Atahan";
const ENLEM = 41.28, BOYLAM = 31.42;      // Karadeniz Ereğli
const UYKU_SAAT = 22, UYKU_DK = 0;        // 22:00
const SABAH_SAAT = 6;                      // gece modu bu saatte biter
const GUNDUZ_PARLAKLIK = 120, GECE_PARLAKLIK = 3; // Fully Kiosk JS arayüzü açıksa kullanılır (0-255)
// Ders programı: 1=Pazartesi ... 5=Cuma. Boş bırakılan günde "Ders programı eklenecek" yazar.
const DERS = {
  1: "",
  2: "",
  3: "",
  4: "",
  5: ""
};
// "Atahan Okul" Google Takvimi (Apps Script web uygulaması)
const TAKVIM_URL = "https://script.google.com/macros/s/AKfycbxl-pXDz_2vnWYrYFTTdnsAdYWTBupBK8jgtshBvTmy1t9h2VwOlnXQsycCMGh7FBjeBg/exec";
/* ============================================== */
let etkinlikler = [];
async function takvimGetir(){
  try{
    const r=await fetch(TAKVIM_URL,{cache:"no-store"});
    const j=await r.json();
    if(Array.isArray(j)) etkinlikler=j;
  }catch(e){}
  okulKarti(new Date());
}
function ayniGun(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}

const AY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const GUN=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const $=id=>document.getElementById(id);
const p=n=>String(n).padStart(2,"0");
let lastNight=null;

function hava(kod,gunduz){
  if(kod===0) return gunduz?["ti-sun","#EF9F27","Güneşli"]:["ti-moon","#CECBF6","Açık"];
  if(kod<=2) return gunduz?["ti-cloud-sun","#FAC775","Parçalı bulutlu"]:["ti-cloud","#B4B2A9","Parçalı bulutlu"];
  if(kod===3) return ["ti-cloud","#B4B2A9","Bulutlu"];
  if(kod===45||kod===48) return ["ti-mist","#B4B2A9","Sisli"];
  if(kod>=51&&kod<=57) return ["ti-cloud-rain","#85B7EB","Çiseliyor"];
  if((kod>=61&&kod<=67)||(kod>=80&&kod<=82)) return ["ti-cloud-rain","#85B7EB","Yağmurlu"];
  if((kod>=71&&kod<=77)||kod===85||kod===86) return ["ti-snowflake","#E6F1FB","Karlı"];
  if(kod>=95) return ["ti-cloud-storm","#AFA9EC","Fırtınalı"];
  return ["ti-cloud","#B4B2A9","Bulutlu"];
}

function oneri(kod,sicaklik,yagis){
  if((kod>=71&&kod<=77)||kod===85||kod===86) return "bere ve eldiven tak";
  if(yagis>=50||(kod>=51&&kod<=67)||(kod>=80&&kod<=82)||kod>=95) return "şemsiyeni al";
  if(sicaklik<12) return "montunu giy";
  if(sicaklik>=25) return "suyunu yanına al";
  return "güzel bir gün";
}

async function havaGetir(){
  const url="https://api.open-meteo.com/v1/forecast?latitude="+ENLEM+"&longitude="+BOYLAM+
    "&current=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FIstanbul&forecast_days=2";
  try{
    const r=await fetch(url,{cache:"no-store"});
    const j=await r.json();
    const c=j.current, d=j.daily;
    const h=new Date().getHours();
    const aksam=h>=18;
    const i=aksam?1:0;
    const [ic,renk,ad]=hava(c.weather_code,c.is_day===1);
    $("wi").className="ti "+ic; $("wi").style.color=renk;
    $("wt").textContent=Math.round(c.temperature_2m)+"°";
    const o=oneri(d.weather_code[i],d.temperature_2m_min[i],d.precipitation_probability_max[i]);
    const oo=aksam?"yarın "+o:o;
    $("wd").textContent=ad+" · "+oo.charAt(0).toLocaleUpperCase("tr")+oo.slice(1);
    $("wtm").textContent=(aksam?"Yarın ":"Bugün ")+Math.round(d.temperature_2m_max[i])+"° / "+Math.round(d.temperature_2m_min[i])+"°";
  }catch(e){
    $("wd").textContent="Hava bilgisi alınamadı";
  }
}

function okulKarti(d){
  const h=d.getHours();
  const hedef=new Date(d); if(h>=14) hedef.setDate(hedef.getDate()+1);
  const g=hedef.getDay();
  const etiket=(h>=14?"Yarın":"Bugün");
  let metin;
  const gunun=etkinlikler.filter(e=>ayniGun(new Date(e.baslangic),hedef)).map(e=>e.baslik);
  if(gunun.length) metin=etiket+": "+gunun.join(" · ");
  else if(g===0||g===6) metin=etiket+" okul yok, iyi tatiller";
  else if(DERS[g]) metin=etiket+": "+DERS[g];
  else metin="Ders programı eklenecek";
  $("sc").innerHTML='<i class="ti ti-backpack" style="color:#5DCAA5"></i>'+metin;
}

function uykuKarti(h,m,gece){
  const sl=$("sl");
  if(gece){ sl.innerHTML='<i class="ti ti-zzz" style="color:#AFA9EC"></i>Uyku vakti, tatlı rüyalar'; return; }
  const kalan=(UYKU_SAAT*60+UYKU_DK)-(h*60+m);
  if(h>=18&&kalan>0){
    const sa=Math.floor(kalan/60), dk=kalan%60;
    sl.innerHTML='<i class="ti ti-moon" style="color:#AFA9EC"></i>Uykuya '+(sa?sa+" sa ":"")+dk+" dk kaldı";
  } else {
    sl.innerHTML='<i class="ti ti-moon" style="color:#AFA9EC"></i>Uyku saati '+p(UYKU_SAAT)+":"+p(UYKU_DK);
  }
}

function parlaklik(gece){
  try{ if(window.fully&&fully.setScreenBrightness) fully.setScreenBrightness(gece?GECE_PARLAKLIK:GUNDUZ_PARLAKLIK); }catch(e){}
}

function tick(){
  const d=new Date(), h=d.getHours(), m=d.getMinutes();
  $("hm").textContent=p(h)+":"+p(m);
  $("ss").textContent=":"+p(d.getSeconds());
  $("dt").textContent=d.getDate()+" "+AY[d.getMonth()]+" "+d.getFullYear()+", "+GUN[d.getDay()];
  const gece=(h*60+m)>=(UYKU_SAAT*60+UYKU_DK)||h<SABAH_SAAT;
  document.body.classList.toggle("night",gece);
  const s=gece?"İyi geceler":h<12?"Günaydın":h<18?"İyi günler":"İyi akşamlar";
  $("gr").textContent=s+" "+AD;
  $("gi").className="ti "+(gece?"ti-moon":"ti-rocket");
  uykuKarti(h,m,gece);
  if(gece!==lastNight){ parlaklik(gece); lastNight=gece; }
  if(d.getSeconds()===0) okulKarti(d);
  if(h===4&&m===0&&d.getSeconds()===0) location.reload();
}

tick(); okulKarti(new Date()); havaGetir(); takvimGetir();
setInterval(tick,1000);
setInterval(takvimGetir,10*60*1000);
setInterval(havaGetir,15*60*1000);
</script>
</body>
</html>
